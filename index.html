<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>

    <form onsubmit="guardar(event)">
        <fieldset>
            <legend><label for="nombres">Nombre(s)</label></legend>
            <input
                type="text"
                id="nombres"
                name="nombres"
                autocomplete="given-name"
                onkeypress="return soloLetras(event)"
                oninput="limpiar(this, /[^a-zñáéíóúü ]/gi)"
                required>
        </fieldset>

        <fieldset>
            <legend><label for="apellidos">Apellido(s)</label></legend>
            <input
                type="text"
                id="apellidos"
                name="apellidos"
                autocomplete="family-name"
                onkeypress="return soloLetras(event)"
                oninput="limpiar(this, /[^a-zñáéíóúü ]/gi)"
                required>
        </fieldset>

        <fieldset>
            <legend><label for="telefono">Teléfono</label></legend>
            <input
                type="tel"
                id="telefono"
                name="telefono"
                autocomplete="tel"
                inputmode="numeric"
                pattern="[0-9]+"
                onkeypress="return soloNumeros(event)"
                oninput="limpiar(this, /[^0-9]/g)"
                required>
        </fieldset>

        <fieldset>
            <legend><label for="correo">Correo electrónico</label></legend>
            <input
                type="email"
                id="correo"
                name="correo"
                autocomplete="email"
                onkeypress="return validarCorreo(event)"
                oninput="limpiar(this, /\s/g)"
                required>
        </fieldset>
         <fieldset>
            <legend>Género</legend>

            <label>
                <input type="radio" name="genero" value="Femenino" required>
                Femenino
            </label>

            <label>
                <input type="radio" name="genero" value="Masculino" required>
                Masculino
            </label>

            <label>
                <input type="radio" name="genero" value="Otro" required>
                Otro
            </label>
        </fieldset>

        <fieldset>
            <legend><label for="biografia">Biografía</label></legend>
            <textarea
                id="biografia"
                name="biografia"
                rows="5"
                cols="30"
                maxlength="300"
                oninput="contarCaracteres()"
                required></textarea>

            <p>Caracteres: <span id="contador">0</span> / 300</p>
        </fieldset>

        <p id="mensaje" role="status"></p>

        <button type="submit">Guardar cambios</button>
    </form>

    <script>
        const mensaje = document.getElementById("mensaje");

        function validarTecla(e, expresion, aviso) {
            if (e.ctrlKey || e.metaKey || e.key.length > 1) {
                return true;
            }

            const permitido = expresion.test(e.key);

            mensaje.textContent = permitido ? "" : aviso;

            return permitido;
        }

        function soloLetras(e) {
            return validarTecla(
                e,
                /^[a-zñáéíóúü ]$/i,

            );
        }

        function soloNumeros(e) {
            return validarTecla(
                e,
                /^[0-9]$/,

            );
        }

        function validarCorreo(e) {
            return validarTecla(
                e,
                /^\S$/,
            );
        }

        function limpiar(campo, expresion) {
            const original = campo.value;

            campo.value = original.replace(expresion, "");

            if (original !== campo.value) {
                mensaje.textContent = "Se eliminaron caracteres no permitidos.";
            } else {
                mensaje.textContent = "";
            }
        }

        function contarCaracteres() {
            const biografia = document.getElementById("biografia");
            const contador = document.getElementById("contador");

            contador.textContent = biografia.value.length;
            mensaje.textContent = "";
        }

        function guardar(e) {
            e.preventDefault();

            const nombres = document.getElementById("nombres");
            const apellidos = document.getElementById("apellidos");
            const biografia = document.getElementById("biografia");

            nombres.value = nombres.value.trim();
            apellidos.value = apellidos.value.trim();
            biografia.value = biografia.value.trim();

            contarCaracteres();

            if (
                nombres.value === "" ||
                apellidos.value === "" ||
                biografia.value === ""
            ) {
                mensaje.textContent = "Completa los campos sin usar solamente espacios.";
                return;
            }
        }
    </script>

        
</body>
</html>
